[project]
name = "extraction-tool"
version = "0.2.0"
description = "Deterministic document extraction and reading acquisition pipeline."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Richard Deegan" },
]
keywords = [
    "pdf",
    "extraction",
    "ocr",
    "document-processing",
    "reading-list",
    "data-access",
    "fastapi",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "bs4>=0.0.2",
    "fastapi[standard]>=0.141.1",
    "pydantic>=2.0,<3.0",
    "ruff>=0.16.2",
    "selenium>=4.47.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "slowapi>=0.1.9",
    "uvicorn>=0.30",
]

extraction = [
    "pymupdf>=1.24",
]

scraping = [
    "beautifulsoup4>=4.12",
]

browser = [
    "selenium>=4.0",
]

dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
extraction-tool = "extraction_tool.cli:main"

[project.urls]
Repository = "https://github.com/RichardDeegan88/Extraction_Tool"
Issues = "https://github.com/RichardDeegan88/Extraction_Tool"

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "pillow",
    "reportlab",
    "pypdf",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = false
plugins = ["pydantic.mypy"]
